[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dash-emoji-mart"
version = "0.2.1"
description = "emoji-mart for Dash — a full-featured emoji picker component with custom emoji categories and Iconify icon-set support."
readme = "README.md"
# 3.9, not 3.8. `dash` 4.4.1 itself requires >=3.9, so a 3.8 user would be
# silently resolved back to an old Dash — a worse experience than a clear
# "needs 3.9". Python 3.8 has also been EOL since October 2024. Every version
# in this range is verified by the package-python-range CI job.
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pip Install Python LLC", email = "pipinstallpython@gmail.com" }]
keywords = [
    "dash", "emoji", "emoji-mart", "emoji-picker", "plotly", "plotly-dash",
    "iconify", "picker", "react",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Dash",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: JavaScript",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Widget Sets",
]
# The package ships one self-contained webpack bundle (emoji-mart, its data set
# and React glue are all inside it), so `dash` is the only runtime requirement.
# Everything in requirements.txt exists to run the documentation site.
#
# The 4.1 floor is deliberate and new in 0.2.0: the Python component classes are
# generated by `dash-generate-components` under Dash 4, and the CI matrix
# measures 4.1.0 -> 4.4.1 on every push. 0.0.x was generated under Dash 3.
dependencies = ["dash>=4.1"]

# `dash_emoji_mart.iconify` turns any of Iconify's 150+ icon sets into
# emoji-mart custom categories. It is the ONLY part of the package that reaches
# the network, so its dependency is opt-in and the module imports lazily —
# `import dash_emoji_mart` never needs requests.
[project.optional-dependencies]
iconify = ["requests>=2.31"]

[project.urls]
Homepage = "https://emojimart.2plot.dev"
Documentation = "https://emojimart.2plot.dev"
Repository = "https://github.com/pip-install-python/dash-emoji-mart"
Issues = "https://github.com/pip-install-python/dash-emoji-mart/issues"
Changelog = "https://github.com/pip-install-python/dash-emoji-mart/blob/main/CHANGELOG.md"
Discord = "https://discord.gg/WEnZR35mrK"

# Ship ONLY the built Python package: the generated component classes plus the
# webpack bundle. The JS source (src/), node_modules, the documentation site
# (docs/, pages/, lib/, components/, assets/) and its requirements are not
# packaged — CI asserts that against the built wheel.
[tool.setuptools]
packages = ["dash_emoji_mart"]
include-package-data = true

# `metadata.json` is a build-time react-docgen artifact that nothing loads at
# runtime (__init__.py registers the bundle via `_js_dist`), so it is
# intentionally NOT packaged.
[tool.setuptools.package-data]
dash_emoji_mart = ["*.js", "*.js.map", "*.js.LICENSE.txt", "package-info.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
