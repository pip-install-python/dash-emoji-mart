name: CD

# Deploys emojimart.2plot.dev, then checks the live site.
#
# Ported from dash-documentation-boilerplate 1.2.4. THIS workflow owns `main`:
# ci.yml is `pull_request` / `workflow_dispatch` / `workflow_call` only and is
# invoked here via `uses:`, so a push to main runs the test matrix exactly once
# instead of twice (LESSONS §15).
#
# THE ROAD (template 1.6.35, owner decision A of 2026-08-29): Render
# auto-deploys the `release` branch, and ONLY this workflow writes `release` —
# a fast-forward push of the run's own sha, after the CI matrix is green. A
# push to `main` is therefore not a deploy; it is a candidate. Measured reason,
# on the template: at 14:12Z on 2026-08-29 a commit was pushed to main, Render
# (watching main) built it within the minute, its CD run went red at 14:13Z
# with the deploy job skipped, and /healthz served the red build for ~6
# minutes. CI cannot stop a deploy while the platform watches the branch CI is
# still judging. Now it watches a branch that only ever holds certified commits.
#
# The Render deploy-hook step is GONE from this file; the repository secret it
# read (the `…_DEPLOY_HOOK_URL` one) is inert and safe to delete — its name is
# deliberately not spelled here, because sync item 13's detect greps this file
# for it. `main` ahead of `release` means an uncertified push is pending (its
# run red or still running) — never "drift", never a reason to deploy by hand.
#
# NOTE FOR THE FIRST DEPLOY: until emojimart.2plot.dev resolves, the verify job
# fails — correctly. It is asserting a live site that does not exist yet. The
# order is: create the Render service, attach the domain, upload the social card
# to the CDN, and only then expect this workflow to be green.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: Site to verify (skips the deploy when set to another host)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SITE_URL: ${{ inputs.target_url || 'https://emojimart.2plot.dev' }}

jobs:
  test:
    name: ci
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy to render
    needs: [test]
    runs-on: ubuntu-latest
    # Long enough for the build-match wait below (up to 100 × 15s = 25m)
    # and no longer. Without it the job inherits GitHub's six-hour default,
    # which is how a platform that never comes back healthy holds the
    # `cd-production` concurrency group all day. 20 minutes was too short
    # for the round that matters most: a floor bump busts the pip cache, so
    # the deploy carrying it is Render's slowest build of the cycle —
    # dash-email timed out on exactly that class (1.6.13).
    timeout-minutes: 30
    environment:
      name: production
      url: https://emojimart.2plot.dev
    # `contents: write` on THIS job only — it is the one thing in the workflow
    # that writes to the repository (the `release` ref). The workflow-level
    # grant above stays `read`.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL history, not the default depth-1 shallow clone. A shallow HEAD
          # pushed onto an EXISTING `release` is rejected as non-fast-forward
          # ("fetch first") because the clone cannot show the remote that
          # release's tip is an ancestor. The template's FIRST promote
          # succeeded only because `release` did not exist yet; its SECOND
          # (run 33262495272, 2026-08-29) failed in one second. A fork does not
          # see this until its own second push.
          # tests/test_cd_promotes_release.py pins it.
          fetch-depth: 0

      - name: Promote to release
        # Only a push to main promotes. A workflow_dispatch that names another
        # host (target_url) is a verify-only run against that host and must not
        # move this repo's release ref. The hook step this replaced had no such
        # guard; the wait below never did either, and still spins against
        # whatever SITE_URL says.
        if: github.event_name == 'push' || inputs.target_url == ''
        run: |
          # Fast-forward push of the run's own sha. `needs: [test]` is the
          # gate: a red matrix never reaches this step, so `release` cannot
          # receive an uncertified commit by construction. On the FIRST run
          # `release` does not exist yet and this push creates it.
          #
          # NOT --force, on purpose: a non-fast-forward means somebody wrote
          # `release` by hand (a rollback, a hotfix). This job then FAILS and
          # says so; a force here would silently undo that person.
          #
          # GITHUB_TOKEN pushes trigger no workflows — correct: `on:` is
          # main-only, and it is Render, not Actions, that reacts to `release`
          # (render.yaml `branch: release`, autoDeploy on).
          git push origin "HEAD:refs/heads/release"
          echo "::notice::release → ${GITHUB_SHA} (fast-forward)"

      - name: Wait for THIS build to serve traffic
        # UNCHANGED by 1.6.35: Render deploys `release`, which the step above
        # just set to this run's sha, so the wait still means what it meant —
        # hold until /healthz reports THIS build. Its own history: an older
        # shape gated this wait on the deploy step, so it was SKIPPED on every
        # run, putting the battery three seconds after the push against the
        # PREVIOUS release. That was invisible for the workflow's whole life,
        # because the old build always already passed the old battery; it only
        # loses the race when a run adds a new surface. Found on muicharts
        # 2026-08-21 and fixed fleet-wide.
        run: |
          # A bare 200 proves nothing about WHICH build answered — /healthz now
          # reports the running instance's commit (RENDER_GIT_COMMIT, see
          # lib/health.py), and this loop holds until it equals the SHA that
          # triggered this run.
          #
          # Fallback: a build predating the field gets the old sustained-health
          # wait plus a warning naming what it cannot tell. That fires exactly
          # once — on the deploy that carries the field for the first time,
          # which is this one.
          want="${GITHUB_SHA}"
          matched=0
          ok=0
          for _ in $(seq 1 100); do
            body="$(curl -fsS "$SITE_URL/healthz" 2>/dev/null || true)"
            if [ -n "$body" ]; then
              build="$(printf '%s' "$body" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("build",""))' 2>/dev/null || true)"
              if [ "$build" = "$want" ]; then
                matched=$((matched + 1))
                [ "$matched" -ge 3 ] && break
              elif [ -z "$build" ]; then
                ok=$((ok + 1))
              fi
            fi
            sleep 15
          done
          if [ "$matched" -ge 3 ]; then
            echo "::notice::live /healthz reports build $want — verifying the artifact this run shipped."
          elif [ "$ok" -ge 5 ]; then
            echo "::warning::live /healthz predates the build field — cannot prove WHICH build is serving; verified sustained health only. This warning should appear exactly once."
          else
            echo "::error::$SITE_URL never served this run's build ($want) and never became reliably healthy"
            exit 1
          fi

  verify:
    name: verify the live site
    needs: [deploy]
    # ONLY after a SUCCESSFUL deploy (1.6.35 fix-forward, ops finding on the
    # template's run 33262495272): the old
    # `always() && != 'cancelled' && != 'skipped'` admitted 'failure', so when
    # the promote step failed this job ran anyway and reported GREEN — it had
    # smoke-tested the PREVIOUS build. A verify that passes when nothing
    # deployed must not exist. (muicharts' skipped-guard of 1.6.16 is subsumed:
    # skipped is not success either.)
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # SITE lane: the interpreter that runs the live battery. Held to the
          # image's minor by tests/test_python_version.py.
          python-version: "3.14"

      - name: The live build IS this run's sha
        # Belt to the `if:` above's braces, and stronger: it also catches a
        # promote that succeeded while Render's build did not, or a later run
        # that promoted past us between deploy and verify. Skipped on a
        # workflow_dispatch against another host (its shas are not ours).
        if: github.event_name == 'push' || inputs.target_url == ''
        run: |
          build="$(curl -fsS "$SITE_URL/healthz" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("build",""))')"
          if [ "$build" != "$GITHUB_SHA" ]; then
            echo "::error::verify refuses: $SITE_URL serves build '${build:-<none>}', this run is $GITHUB_SHA — nothing this run shipped is on the wire to verify"
            exit 1
          fi
          echo "::notice::verifying build $build (this run's sha)"

      - name: Install the battery's dependencies
        run: python -m pip install requests

      # A cold free-tier container answers the first probe with Render's
      # loading page or a hang, and every assertion after that measures the
      # wrong thing (LESSONS §21). Wake it before asserting anything.
      - name: Wake the host
        run: |
          for _ in $(seq 1 12); do
            curl -fsS "$SITE_URL/healthz" > /dev/null && break
            sleep 5
          done

      # The network battery first: it is the same script, with the same check
      # names, that CI ran against the container this deploy shipped. A name
      # that passed in CI and fails here isolates the fault to the deploy.
      - name: Network smoke battery
        run: python scripts/network_smoke.py --base-url "$SITE_URL"

      # Then the satellite-specific checks the battery does not make: every
      # canonical, every crawler body, the real pixels of the CDN social card,
      # and every peer llms.txt in the directory actually resolving.
      - name: Smoke-test the deployment
        run: python scripts/smoke_live.py "$SITE_URL"

      - name: Report
        if: failure()
        run: |
          echo "::error::Live verification failed for $SITE_URL. Every failure these check for is silent in production: a site identity that fell back to a framework default, a stale dash-improve-my-llms artifact, a canonical on the wrong host, a page serving the JavaScript stub, a missing network directory, a social card that 404s on the CDN, and dead peer llms.txt links."
