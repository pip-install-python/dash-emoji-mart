name: CD

# Deploys emojimart.2plot.dev, then checks the live site.
#
# Ported from dash-documentation-boilerplate 1.2.4. THIS workflow owns `main`:
# ci.yml is `pull_request` / `workflow_dispatch` / `workflow_call` only and is
# invoked here via `uses:`, so a push to main runs the test matrix exactly once
# instead of twice (LESSONS §15).
#
# The deploy step POSTs to a Render deploy hook held in the
# RENDER_DEPLOY_HOOK_URL secret. Without that secret the step is skipped and the
# workflow goes straight to verification — which is the correct posture for this
# repo today, because render.yaml sets `autoDeploy: true` and Render deploys
# from GitHub on its own. Setting the secret later changes nothing except that
# CD stops racing Render's own trigger.
#
# NOTE FOR THE FIRST DEPLOY: until emojimart.2plot.dev resolves, the verify job
# fails — correctly. It is asserting a live site that does not exist yet. The
# order is: create the Render service, attach the domain, upload the social card
# to the CDN, and only then expect this workflow to be green.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: Site to verify (skips the deploy when set to another host)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SITE_URL: ${{ inputs.target_url || 'https://emojimart.2plot.dev' }}

jobs:
  test:
    name: ci
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy to render
    needs: [test]
    runs-on: ubuntu-latest
    # Long enough for the wait loop below (a 120s settle plus up to 40 × 15s)
    # and no longer. Without it the job inherits GitHub's six-hour default,
    # which is how a platform that never comes back healthy holds the
    # `cd-production` concurrency group all day.
    timeout-minutes: 20
    environment:
      name: production
      url: https://emojimart.2plot.dev
    outputs:
      deployed: ${{ steps.hook.outputs.deployed }}
    steps:
      - name: Trigger the Render deploy hook
        id: hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not set. Skipping the deploy trigger and verifying whatever is currently live."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for the new build to serve traffic
        if: steps.hook.outputs.deployed == 'true'
        run: |
          # Render swaps instances rather than restarting in place, so the old
          # build answers /healthz throughout. Waiting for a single 200 proves
          # nothing (LESSONS §16); give the build time, then require sustained
          # health — five consecutive successes.
          sleep 120
          ok=0
          for _ in $(seq 1 40); do
            if curl -fsS "$SITE_URL/healthz" > /dev/null; then
              ok=$((ok + 1))
              [ "$ok" -ge 5 ] && break
            else
              ok=0
            fi
            sleep 15
          done
          if [ "$ok" -lt 5 ]; then
            echo "::error::$SITE_URL never became reliably healthy"
            exit 1
          fi

  verify:
    name: verify the live site
    needs: [deploy]
    if: always() && needs.deploy.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the battery's dependencies
        run: python -m pip install requests

      # A cold free-tier container answers the first probe with Render's
      # loading page or a hang, and every assertion after that measures the
      # wrong thing (LESSONS §21). Wake it before asserting anything.
      - name: Wake the host
        run: |
          for _ in $(seq 1 12); do
            curl -fsS "$SITE_URL/healthz" > /dev/null && break
            sleep 5
          done

      # The network battery first: it is the same script, with the same check
      # names, that CI ran against the container this deploy shipped. A name
      # that passed in CI and fails here isolates the fault to the deploy.
      - name: Network smoke battery
        run: python scripts/network_smoke.py --base-url "$SITE_URL"

      # Then the satellite-specific checks the battery does not make: every
      # canonical, every crawler body, the real pixels of the CDN social card,
      # and every peer llms.txt in the directory actually resolving.
      - name: Smoke-test the deployment
        run: python scripts/smoke_live.py "$SITE_URL"

      - name: Report
        if: failure()
        run: |
          echo "::error::Live verification failed for $SITE_URL. Every failure these check for is silent in production: a site identity that fell back to a framework default, a stale dash-improve-my-llms artifact, a canonical on the wrong host, a page serving the JavaScript stub, a missing network directory, a social card that 404s on the CDN, and dead peer llms.txt links."
