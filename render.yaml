# render.yaml — Render Blueprint for the dash-emoji-mart documentation site.
# Deploys run.py as a Docker web service, fronted by https://emojimart.2plot.dev.
# Blueprint spec: https://render.com/docs/blueprint-spec
#
# How to deploy:
#   1. Push this repo (with Dockerfile + render.yaml) to GitHub.
#   2. Render dashboard → New → Blueprint → select this repo.
#   3. Render builds the Dockerfile and serves run:server.
#   4. Add the custom domain emojimart.2plot.dev and point its CNAME at the
#      service.
#   5. Register the app on the 2plot network so its traffic series gets a label:
#      add `emojimart=https://emojimart.2plot.dev/healthz` to PULSE_POLL_TARGETS
#      on 2plot.ai, and set CROSS_APP_WEBHOOK_SECRET below to the shared value.
#
# Local equivalent (no Render needed):
#   docker build -t dash-emoji-mart-docs .
#   docker run --rm -p 8050:8050 -e PORT=8050 dash-emoji-mart-docs
#   open http://localhost:8050
#
# NOTE: this app ships DARK — every page is public (PAGE_DEFAULT_TIER below) —
# but it now carries the full interactive-gate stack and the Clerk block, so
# the phase-4 flip is one environment change on the service and not a redeploy.
# The gate wave's rule: ship dark, verify from the deploy log, flip later.
services:
  - type: web
    name: dash-emoji-mart-docs
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Starter, not free (upgraded 2026-08-16 for the x402 instrumentation
    # window): the free tier sleeps after ~15 min idle, cold-starts on the next
    # request, and its evictions wipe the analytics ledger mid-day — 30 days of
    # crawl data is exactly what the network's 402 decision reads, so the data
    # must survive the container. The disk below is the other half of that.
    plan: starter
    # /healthz is the 2plot network convention (lib/health.py) and is excluded
    # from traffic counts, so it makes a cleaner check than /.
    healthCheckPath: /healthz
    # `release` is written ONLY by CD (.github/workflows/cd.yml, job `deploy`:
    # a fast-forward push of the run's sha after the matrix is green). A push
    # to main is not a deploy — it is a candidate. autoDeploy below stays on:
    # Render reacting to this branch IS the mechanism (template 1.6.35).
    #
    # IF THIS SERVICE IS NOT BLUEPRINT-MANAGED this line is documentation and
    # the dashboard's Branch field is the actual switch — an owner step, listed
    # in the sync report, never done from a session.
    branch: release
    autoDeploy: true
    envVars:
      # --- Core --------------------------------------------------------
      # Flask (WSGI) backend, served by gunicorn. Do NOT set fastapi/quart
      # here: those are ASGI and would need uvicorn instead of gunicorn.
      - key: DASH_BACKEND
        value: flask
      # gunicorn worker processes. 2 is a reasonable default; drop to 1 if the
      # free tier's 512 MB feels tight. The Dockerfile also runs 4 threads per
      # worker for callback concurrency.
      - key: WEB_CONCURRENCY
        value: "2"
      # Public origin for canonical URLs, sitemap.xml and llms.txt.
      #
      # BOTH names, on purpose (LESSONS §12). `APP_BASE_URL` is the network-wide
      # spelling every other satellite and every shared script reads, and it
      # wins; `DASH_EMOJI_MART_BASE_URL` is this repo's original name. Removing
      # either one from a live service is how a host quietly starts advertising
      # the wrong canonical origin — so they stay together, one value.
      - key: APP_BASE_URL
        value: https://emojimart.2plot.dev
      - key: DASH_EMOJI_MART_BASE_URL
        value: https://emojimart.2plot.dev

      # --- 2plot.dev ad network (lib/ad_client.py) ---------------------
      # Without AD_SERVER_URL reachable the slot simply stays hidden, and a
      # 60s circuit breaker stops retrying, so an outage never slows a page.
      - key: AD_SERVER_URL
        value: https://2plot.dev
      # This app's identity in the ad network's /admin/ad-board tables.
      #
      # "emojimart" — the hub's DIRECTORY KEY, not the PyPI package name. This
      # said "dash-emoji-mart" while SATELLITE_APP_KEY below already said
      # "emojimart", so the same app would have arrived at the hub under two
      # ids and its ad rows would never have lined up with its traffic rows.
      # STANDARD §5: one short id on every hub surface.
      - key: AD_APP_ID
        value: emojimart

      # --- 2plot.dev network bulletin (lib/bulletin.py) ----------------
      # Hub-published tips and announcements, rendered in the header of the
      # llms.txt viewer.
      #
      # LISTED HERE, BUT THAT IS NOT ENOUGH. Blueprint envVars apply on
      # Blueprint SYNC, not on git-push autodeploys, so a service created
      # before this line existed will never pick it up (LESSONS §10). Set it on
      # the SERVICE in the Render dashboard as well. The symptom of getting
      # this wrong is one generic tip in the viewer banner where the hub
      # publishes several — which reads as a styling difference, not as a
      # missing integration. The boot log says which state the process is in.
      - key: NETWORK_BULLETIN_URL
        value: https://2plot.dev/api/network/bulletin

      # --- 2plot.ai satellite analytics (lib/satellite_reporter.py) ----
      # The shared HMAC secret every satellite holds. Set it in the Render
      # dashboard (same value as on 2plot.ai) — never in this file.
      # Without it the app still serves /healthz but reports nothing.
      - key: CROSS_APP_WEBHOOK_SECRET
        sync: false
      # The series this app reports under on 2plot.ai/traffic. "emojimart" is
      # this app's key in the hub's network directory; the hub labels and
      # colours the series from it.
      #
      # NOTE the variable name: SATELLITE_APP_KEY, not the SATELLITE_APP_ID the
      # retired satellite_analytics.py read. lib/satellite_reporter.py (copied
      # from the boilerplate) reads APP_KEY and defaulted to "boilerplate" —
      # so a deployment that kept the old variable name would have reported
      # this app's traffic as the boilerplate's and overwritten its rows.
      - key: SATELLITE_APP_KEY
        value: emojimart
      # Seconds between rollup POSTs. The contract asks for hourly; 1800 halves
      # what a free-tier eviction can swallow.
      - key: SATELLITE_REPORT_INTERVAL_S
        value: "1800"
      # Access tier for the tiered corpus documents (/llms-small.txt and
      # /llms-full.txt — dash-improve-my-llms >= 2.4.0). Deliberately set to
      # the default here so every fork SEES the knob: the 402 experiment
      # tightens the full corpus by flipping this to `auth`, per satellite,
      # with no code change. See .env.example for the tier values.
      - key: LLMS_SMALL_TIER
        value: public
      - key: LLMS_FULL_TIER
        value: public

      # The visitor ledger traffic_rollup reads. The hub takes the LAST report
      # for a given (app, date), so an ephemeral ledger is not merely lossy —
      # a mid-day deploy wipes it and the next hourly report OVERWRITES the
      # day's real total with whatever accrued since the restart. /tmp is
      # wiped on every deploy even on a paid plan, which is why this points at
      # the mounted disk below.
      - key: TRAFFIC_ANALYTICS_FILE
        value: /var/data/visitor_analytics.json

      # --- The interactive gate (lib/access.py, lib/gate_layouts.py) ------
      # THE FLIP LEVER, and the reason the wave ships dark. `public` is the
      # tier every page without frontmatter of its own resolves to, so this
      # single value is what stands between the current site and a sign-in
      # card on every doc. Set explicitly rather than left unset: its presence
      # is also what forces the access wiring on (run.py's configure(force=)),
      # so the verdict plumbing and the prerender's use of it are exercised
      # NOW, during the dark launch, instead of first at the moment of a flip.
      #
      # Rollback is this value, and nothing else — no code revert anywhere.
      - key: PAGE_DEFAULT_TIER
        value: public

      # The SECOND axis, and the phase-4 agent flip. While "1", the machine
      # surfaces (the llms.txt family, crawler HTML, the prerender) stay open
      # even on pages the interactive gate closes — which is what keeps the
      # 30-day crawl-demand measurement running while humans meet a sign-in
      # card. Setting it to "0" closes the machine lane everywhere at once.
      #
      # Declared here at its default so the knob is VISIBLE. The wave leaves
      # it at 1 on every host until phase 4.
      - key: LLMS_PUBLIC_DEFAULT
        value: "1"

      # --- Clerk satellite auth (lib/auth.py) -----------------------------
      # Every one of these is inert until CLERK_SECRET_KEY and
      # CLERK_PUBLISHABLE_KEY are actually set in the dashboard: lib/auth.py
      # registers nothing without them and the site runs exactly as public as
      # it does today. They are declared here so the flip is a dashboard
      # action rather than a blueprint edit.
      #
      # BLUEPRINT vs DASHBOARD, the leaflet lesson: a variable declared in
      # this file is not a variable present on the running service. The
      # dashboard add is what reaches it. Diff declared-vs-live before any
      # flip — leaflet measured SEVEN declared variables absent live.
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      # The 2plot.ai PRIMARY on its production Clerk instance (Account Portal
      # + Frontend API custom domains — not *.accounts.dev).
      - key: CLERK_SIGN_IN_URL
        value: https://accounts.2plot.ai/sign-in
      - key: CLERK_SIGN_UP_URL
        value: https://accounts.2plot.ai/sign-up
      # THE RETURN TRIP — the stage-5 blocker the leaflet pilot surfaced.
      # Unset, buildSatelliteRedirect() returns null and an authenticated
      # reader is stranded on the primary, silently. A truthy NON-URL is
      # worse: a Sign In button that 404s. lib/auth.py boot-guards both, and
      # the ABSENCE of its two [auth] warnings from the deploy log is one of
      # the gate wave's acceptance checks.
      - key: CLERK_SATELLITE_SIGN_IN_REDIRECT
        value: https://2plot.ai/onboarding
      # REQUIRED in satellite mode: a production custom-domain instance cannot
      # derive this from CLERK_SIGN_IN_URL.
      - key: CLERK_FRONTEND_API
        value: https://clerk.2plot.ai
      # The REGISTERED SATELLITE DOMAIN — deliberately NOT the host this app
      # is served on. Every *.2plot.dev docs host is an ALLOWED SUBDOMAIN of
      # the one registered satellite, so this says 2plot.dev and not
      # emojimart.2plot.dev.
      - key: CLERK_SATELLITE_DOMAIN
        value: 2plot.dev
      - key: CLERK_IS_SATELLITE
        value: "true"
      # Signs the session and __dca_identity cookies. Without it
      # dash-clerk-auth falls back to a PUBLIC dev default string — so this
      # must be generated per service and must never be shared between hosts.
      - key: SESSION_SECRET
        generateValue: true
      # Admin allowlist for admin-tier pages (lib.auth.is_admin_user), which
      # on this host means /admin/control-board.
      - key: ADMIN_EMAILS
        sync: false

      # The control board's override store — the OTHER half of the disk below.
      # A board toggle that resets on every deploy is worse than no board: it
      # silently republishes a page somebody deliberately hid. lib/auth.py and
      # lib/page_visibility.py boot-guard both /var/data paths, and it is the
      # absence of that [visibility] warning — not the Render dashboard — that
      # the wave accepts this host on.
      - key: PAGE_VISIBILITY_FILE
        value: /var/data/page_visibility.json

      # --- Iconify (dash_emoji_mart.iconify) ---------------------------
      # The /iconify page builds its categories at import time and caches the
      # API responses for 24h. Now that the analytics disk exists the cache
      # rides along on it — /tmp is wiped on every deploy, and refilling from
      # the Iconify API on each boot was only ever tolerated for want of a
      # persistent directory.
      - key: DASH_EMOJI_MART_CACHE_DIR
        value: /var/data/iconify-cache

    # 1 GB at /var/data, and it now carries TWO ledgers: the visitor analytics
    # (TRAFFIC_ANALYTICS_FILE) and the control board's overrides
    # (PAGE_VISIBILITY_FILE). Without it both sit on the container filesystem
    # and every deploy erases them — the day's traffic total AND whichever
    # pages somebody hid.
    #
    # A DECLARATION ATTACHES NOTHING (leaflet, 2026-08-21): that repo ran for
    # weeks with this exact block and no disk, the app quietly mkdir'd
    # /var/data on the container filesystem, and every deploy wiped both.
    # Verify in the dashboard's Disks tab, or trust the boot guards — a
    # [visibility] warning names exactly which half is missing, and its
    # absence is the pass. Accepted trade-off, fleet-wide: a disk-backed
    # service restarts with a brief blip instead of overlapping instances,
    # which is correct for a docs site (and is why cd.yml now verifies WHICH
    # build is answering /healthz).
    disk:
      name: analytics
      mountPath: /var/data
      sizeGB: 1
